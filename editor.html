<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageSnap Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="app-shell">
    <aside class="toolbar">
      <div class="brand">
        <p class="eyebrow">Annotation Studio</p>
        <h1>PageSnap Editor</h1>
      </div>

      <div class="tool-grid" role="toolbar" aria-label="Annotation tools">
        <button class="tool-button is-active" data-tool="rectangle">Rectangle</button>
        <button class="tool-button" data-tool="arrow">Arrow</button>
        <button class="tool-button" data-tool="text">Text</button>
      </div>

      <div class="field">
        <span>Color</span>
        <div class="color-swatches" role="group" aria-label="Annotation color">
          <button type="button" class="color-swatch is-active" data-color="#e53935" title="Red" aria-label="Red"></button>
          <button type="button" class="color-swatch" data-color="#43a047" title="Green" aria-label="Green"></button>
        </div>
      </div>

      <div class="actions">
        <button id="undoButton" class="secondary">Undo</button>
        <button id="copyButton" class="secondary">Copy Image</button>
        <button id="downloadButton" class="primary">Download PNG</button>
      </div>

      <p id="editorStatus" class="status">Loading capture...</p>
    </aside>

    <main class="canvas-area">
      <div class="canvas-wrap">
        <canvas id="editorCanvas"></canvas>
      </div>
    </main>
  </div>

  <script src="editor.js" type="module"></script>
</body>
</html>
