<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapCanvas</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <div class="hero">
      <p class="eyebrow">Screenshot Capture</p>
      <h1>SnapCanvas</h1>
      <p class="subtitle">Capture the current tab, then mark it up with fast annotation tools.</p>
    </div>

    <section class="options" aria-label="Capture options">
      <div class="options-row">
        <label for="delaySelect">Capture delay</label>
        <select id="delaySelect" aria-label="Capture delay">
          <option value="0" selected>None</option>
          <option value="3000">3 seconds</option>
          <option value="5000">5 seconds</option>
          <option value="10000">10 seconds</option>
        </select>
      </div>
      <label class="check-row" for="includeSticky">
        <input type="checkbox" id="includeSticky"> Include sticky header (full-page)
      </label>
    </section>

    <section class="actions" aria-label="Capture modes">
      <button class="capture-button" data-mode="full" aria-label="Full page capture">
        <span class="label">Full page <span class="kbd-hint">· Ctrl+Shift+1</span></span>
        <span class="hint">Scroll and stitch the whole document</span>
      </button>
      <button class="capture-button" data-mode="visible" aria-label="Visible area capture">
        <span class="label">Visible area <span class="kbd-hint">· Ctrl+Shift+2</span></span>
        <span class="hint">Grab exactly what is on screen now</span>
      </button>
      <button class="capture-button" data-mode="selected" aria-label="Selected area capture">
        <span class="label">Selected area <span class="kbd-hint">· Ctrl+Shift+3</span></span>
        <span class="hint">Pick a region before capture</span>
      </button>
    </section>

    <section id="historySection" class="history" aria-label="Recent captures" hidden>
      <div class="history-head"><span>Recent</span><button id="clearHistory" class="link-btn" type="button">Clear</button></div>
      <div id="historyStrip" class="history-strip" role="list"></div>
    </section>

    <details class="settings" id="settingsPanel">
      <summary>Settings</summary>
      <label class="field"><span>Filename template</span><input id="filenameTemplate" placeholder="pagesnap-{domain}-{date}-{mode}" spellcheck="false"><small>Vars: {domain} {date} {mode} {title}</small><small id="filenamePreview" style="color:#6b6257;font-size:11px;display:block;margin-top:4px;word-break:break-all"></small></label>
      <label class="field"><span>Default color</span>
        <select id="defaultColor"><option value="#43a047">Green</option><option value="#e53935">Red</option><option value="#1e88e5">Blue</option><option value="#fb8c00">Orange</option><option value="#212121">Black</option><option value="#fafafa">White</option></select>
      </label>
    </details>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>

  <script src="popup.js" type="module"></script>
</body>
</html>
