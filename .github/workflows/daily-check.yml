name: Daily Repo Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  validate-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Validate manifest and required assets
        shell: bash
        run: |
          test -f manifest.json
          test -f assets/icon16.png
          test -f assets/icon32.png
          test -f assets/icon48.png
          test -f assets/icon128.png
          node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8')); if (manifest.manifest_version !== 3) throw new Error('Manifest must use version 3'); if (!manifest.background?.service_worker) throw new Error('Missing background service worker'); if (!manifest.action?.default_popup) throw new Error('Missing default popup'); if (!manifest.content_security_policy?.extension_pages) throw new Error('Missing content_security_policy.extension_pages (CSP)'); console.log('Manifest validation passed');"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          # Parse as .mjs (strict ESM): plain `node --check` runs sloppy mode and
          # silently accepts duplicate function declarations, which are a
          # SyntaxError in modules (editor.js, popup.js, background.js).
          for f in background.js popup.js selection.js element-picker.js editor.js shared.js; do
            cp "$f" "/tmp/${f%.js}.mjs"
            node --check "/tmp/${f%.js}.mjs"
            rm -f "/tmp/${f%.js}.mjs"
          done
          # Also validate modularized editor sub-modules if present
          for f in modules/*.js; do
            [ -e "$f" ] || continue
            cp "$f" "/tmp/$(basename $f .js).mjs"
            node --check "/tmp/$(basename $f .js).mjs"
            rm -f "/tmp/$(basename $f .js).mjs"
          done

      - name: Install deps (cached)
        shell: bash
        run: npm ci --ignore-scripts || npm install

      - name: Run tests
        shell: bash
        run: npm test

      - name: Lint (if configured)
        shell: bash
        run: |
          if [ -f eslint.config.js ] || [ -f .eslintrc.json ] || [ -f .eslintrc.js ]; then
            npx eslint . || echo "::warning::ESLint found issues"
          else
            echo "No ESLint config — skipping"
          fi

      - name: Check formatting (if configured)
        shell: bash
        run: |
          if [ -f .prettierrc ] || [ -f .prettierrc.json ]; then
            npx prettier --check "**/*.{js,css,html,json,yml}" || echo "::warning::Prettier formatting drift"
          else
            echo "No Prettier config — skipping"
          fi

      # Speed target: validate job < 60s p95 (npm test ~0.2s, lint ~1s). Bottleneck was cold npm install; cache cuts 30s.
