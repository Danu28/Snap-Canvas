name: Daily Repo Check

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  validate-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Validate manifest and required assets
        shell: bash
        run: |
          test -f manifest.json
          test -f assets/icon16.png
          test -f assets/icon32.png
          test -f assets/icon48.png
          test -f assets/icon128.png
          node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8')); if (manifest.manifest_version !== 3) throw new Error('Manifest must use version 3'); if (!manifest.background?.service_worker) throw new Error('Missing background service worker'); if (!manifest.action?.default_popup) throw new Error('Missing default popup'); console.log('Manifest validation passed');"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          # Parse as .mjs (strict ESM): plain `node --check` runs sloppy mode and
          # silently accepts duplicate function declarations, which are a
          # SyntaxError in modules (editor.js, popup.js, background.js).
          for f in background.js popup.js selection.js element-picker.js editor.js; do
            cp "$f" "/tmp/${f%.js}.mjs"
            node --check "/tmp/${f%.js}.mjs"
            rm -f "/tmp/${f%.js}.mjs"
          done
